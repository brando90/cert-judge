[project]
name = "cert-judge"
version = "0.1.0"
description = "Cert-Judge"
readme = "README.md"
authors = [
    { name = "Brando Miranda", email = "brandojazz@gmail.com" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.21.0",
    "lz4>=3.1.10",
    "datasets>=1.17.0",
    "networkx>=2.5",
    "scipy",
    "scikit-learn",
    "pandas",
    "requests",
    "aiohttp",
    "matplotlib",
    "fire",
    "Levenshtein",
    "seaborn",
    "wandb",
    "twine",
    "nvidia-htop; sys_platform != 'darwin'",
    "protobuf",
    "torch==2.7.*",
    "torchvision==0.22.0",
    "outlines==0.1.11",
    "trl",
    "transformers",
    "accelerate>=0.26.0",
    "peft",
    "bitsandbytes; sys_platform != 'darwin'",
    "einops",
    "sentencepiece",
    "brotli",
    "pexpect",
    "jsonlines",
    "vllm; sys_platform != 'darwin'", # gives issues in hyperturning1, so comment out in hyperturning1 is my suggestion
    #"vllm==0.6.4.post1", # gives issues in weston's setup in skampere1 and mercury1
    "antlr4-python3-runtime==4.11",
    "trace-opt",
    "fastchat",
    "dspy",
    "sglang>=0.4.9; sys_platform != 'darwin'",
    "inspect_ai",
    "openai",
    "evaluate",
    "unsloth>=2025.2.14; sys_platform != 'darwin'",
    "unsloth_zoo>=2025.2.7; sys_platform != 'darwin'",
    "setuptools>=80.3.0",
    "tenacity",
    "python-dotenv",
    "orjson",
]
license = {text = "Apache-2.0"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_src/cert_judge"]

[project.optional-dependencies]
build = [
    "psutil>=7.0.0",
]
ti2prime = [
    "ultimate-utils>=0.10.9,<0.11",
]
compile = [
    "flash-attn>=2.7.4.post1; sys_platform != 'darwin'",
]
lean4_pypantograph = [
    "pantograph",
]

[tool.uv]
# GPU-specific find-links - only used on Linux
find-links = ["https://flashinfer.ai/whl/cu124/torch2.5/"]
no-build-isolation-package = ["flash-attn"]
prerelease = "allow"

[tool.uv.sources]
pantograph = { git = "https://github.com/stanford-centaur/PyPantograph", tag = "v0.3.7" }
